# Model download worker — models.asearch.world, R2-backed, no workers.dev.
name = "apple-search-models"
main = "src/models/index.ts"
compatibility_date = "2025-09-20"
workers_dev = false

[[routes]]
pattern = "models.asearch.world"
custom_domain = true

[[r2_buckets]]
binding = "MODELS"
bucket_name = "apple-search-models"

[observability]
enabled = false
